<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生长图集 · 蓝图工坊</title>
  <link rel="stylesheet" href="../../docs/blueprint/blueprint.css" />
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <p class="kicker">Growth atlas</p>
      <h1>均值、速度、身高箱</h1>
      <p class="lede">左图是 6–14 岁脚长均值和一阶差分。右图是按身高 5 cm 分箱的鞋长百分位。交叉发生在 11 岁；9 岁均值回落是原柱状图就有的折点。</p>
    </section>
    <div class="grid two">
      <div class="card"><div id="age-chart" class="chart"></div></div>
      <div class="card"><div id="bin-chart" class="chart"></div></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <label class="field">身高箱
          <select id="bin-select"></select>
        </label>
        <label class="field">看哪一组
          <select id="bin-sex">
            <option value="girl">女童</option>
            <option value="boy">男童</option>
          </select>
        </label>
      </div>
      <p id="bin-copy" class="lede"></p>
    </div>
  </main>
  <script src="../../js/echarts.min.js"></script>
  <script src="../../data/blueprint/payload.js"></script>
  <script src="js/blueprint.js"></script>
  <script src="js/atlas-page.js"></script>
</body>
</html>
