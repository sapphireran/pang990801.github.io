<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>身高 × 鞋码 · 示例</title>
  <link rel="stylesheet" href="./css/examples.css" />
</head>
<body>
  <div class="page">
    <nav class="topnav">
      <a href="./index.html">示例馆</a>
      <a href="../docs/data-notes.html">数据备忘</a>
      <a href="../index.html">大屏</a>
    </nav>
    <h1>身高与鞋码</h1>
    <p class="lead">散点坐标是 <code>[身高cm, 鞋码cm]</code>。鞋码轴是长度，不是 EU 码。框是该组 min–max，竖线是大屏里的参考身高（女 115，男 110）。</p>
    <div id="stats" class="stats"></div>
    <div class="chart-shell"><div id="chart"></div></div>
    <div id="notes" class="notes"></div>
    <footer><a href="./age-foot-length.html">下一张：年龄 × 脚长</a></footer>
  </div>
  <script src="../js/echarts.min.js"></script>
  <script src="./js/example-data.js"></script>
  <script src="./js/chart-helpers.js"></script>
  <script src="./js/render-charts.js"></script>
  <script>
    var female = chartHelpers.summarizePairs(exampleData.heightShoe.female);
    var male = chartHelpers.summarizePairs(exampleData.heightShoe.male);
    chartHelpers.fillStats("#stats", [
      "女童 n=" + female.n + "  r=" + chartHelpers.fmt(female.r, 3),
      "男童 n=" + male.n + "  r=" + chartHelpers.fmt(male.r, 3),
      "女童身高均值 " + chartHelpers.fmt(female.xMean, 1) + " cm",
      "男童身高均值 " + chartHelpers.fmt(male.xMean, 1) + " cm"
    ]);
    exampleCharts.mountStandard("#chart", "#notes", exampleCharts.scatterHeightShoe(), exampleData.heightShoe.notes);
  </script>
</body>
</html>
