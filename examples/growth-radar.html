<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生长雷达 · 示例</title>
  <link rel="stylesheet" href="css/examples.css" />
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a class="brand" href="../index.html">儿童脚型</a>
      <a href="../index.html">仪表盘</a>
      <a href="../docs/index.html">文档</a>
      <a href="./index.html">示例</a>
    </nav>

    <h1>9–12 岁七轴生长雷达</h1>
    <p class="lede">
      对应仪表盘中央图。每个轴的上限都是 100，这些是已经归一化的分数，<strong>不是厘米</strong>。
      12 岁的鞋码 / 脚长在 <code>js/index.js</code> 里写成 <code>77-6</code> 和 <code>79-8</code>，即 71 与 71。
    </p>
    <p id="status" class="status">Waiting…</p>

    <div class="card">
      <div id="chart" class="chart tall"></div>
    </div>

    <h2>分轴分数</h2>
    <div class="card">
      <table id="table"></table>
    </div>
  </div>

  <script src="../js/echarts.min.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/boot.js"></script>
  <script>
    var colors = {
      9: "#00c2ff",
      10: "#f9cf67",
      11: "#32CD32",
      12: "#e92b77"
    };

    ExampleBoot.boot({
      dataUrl: "data/growth-radar.json",
      buildOption: function (data) {
        return {
          backgroundColor: "transparent",
          legend: { bottom: 0, textStyle: { color: "#c9d7e6" } },
          tooltip: {},
          radar: {
            shape: "circle",
            indicator: data.axes.map(function (name) { return { text: name, max: 100 }; }),
            axisName: { color: "#e8f1f8" },
            splitLine: { lineStyle: { color: "rgba(190,190,190,0.35)" } },
            splitArea: { areaStyle: { color: ["rgba(255,255,255,0.02)", "rgba(255,255,255,0.04)"] } },
            axisLine: { lineStyle: { color: "rgba(190,190,190,0.45)" } }
          },
          series: [{
            type: "radar",
            data: data.series.map(function (s) {
              return {
                name: s.age + "岁",
                value: s.values,
                itemStyle: { color: colors[s.age] },
                lineStyle: { width: 2, color: colors[s.age] },
                areaStyle: { color: colors[s.age], opacity: 0.28 }
              };
            })
          }]
        };
      },
      after: function (data) {
        var headers = ["轴"].concat(data.series.map(function (s) { return s.age + "岁"; }));
        var rows = data.axes.map(function (axis, i) {
          return [axis].concat(data.series.map(function (s) { return s.values[i]; }));
        });
        ExampleBoot.fillTable("table", headers, rows);
      }
    });
  </script>
</body>
</html>
