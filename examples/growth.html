<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>年龄与脚长 · 示例</title>
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body class="site-page" data-nav="ex-growth">
  <div id="site-header"></div>
  <div class="site-shell is-wide">
    <aside class="site-side" id="site-side"></aside>
    <div>
      <section class="site-hero">
        <p class="kicker">age-foot-length.json</p>
        <h1>年龄与脚长</h1>
        <p class="lead">6–14 岁组均值。11 岁起差值过零：这份样本里男生脚长开始超过女生。8 到 9 岁的回落保持原样。</p>
        <div class="controls">
          <label>显示
            <select id="mode">
              <option value="both">男女柱 + 差值</option>
              <option value="female">只看女生</option>
              <option value="male">只看男生</option>
              <option value="diff">只看女减男</option>
            </select>
          </label>
        </div>
      </section>
      <section class="chart-card">
        <div id="growth-chart" class="chart-host"></div>
      </section>
      <section class="site-main">
        <h2>均值表</h2>
        <table>
          <thead>
            <tr><th>年龄</th><th>女生 cm</th><th>男生 cm</th><th>女 − 男</th></tr>
          </thead>
          <tbody id="growth-rows"></tbody>
        </table>
      </section>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="../js/echarts.min.js"></script>
  <script src="../js/data-loader.js"></script>
  <script src="../js/site-nav.js"></script>
  <script src="../js/examples/growth.js"></script>
</body>
</html>
