<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Age vs foot length — examples</title>
  <link rel="stylesheet" href="../css/examples.css" />
</head>
<body class="chart-page">
  <header>
    <div>
      <p class="eyebrow">examples/data/age-foot-length.json</p>
      <h1>Age vs mean foot length</h1>
    </div>
    <nav>
      <a href="../index.html">Gallery</a>
      <a href="../../index.html">Dashboard</a>
    </nav>
  </header>
  <main class="page">
    <p class="lead">
      Dashboard means for ages 6–14. The difference line is girl minus
      boy and changes sign at age 11.
    </p>
    <div class="chart-shell"><div class="chart" id="chart"></div></div>
    <table id="table"></table>
  </main>
  <script src="../../js/echarts.min.js"></script>
  <script src="../js/foot-stats.js"></script>
  <script src="../js/example-common.js"></script>
  <script>
    (function () {
      var C = ExampleCommon;
      var F = FootStats;
      var chartNode = C.$("#chart");

      C.loadJson("../data/age-foot-length.json").then(function (data) {
        var rows = F.zipAgeSeries(data);
        C.fillTable(
          C.$("#table"),
          ["Age", "Girls (cm)", "Boys (cm)", "Girl − boy (cm)"],
          rows.map(function (row) {
            return [
              String(row.ageYears),
              F.formatFixed(row.girlsFootLengthCm),
              F.formatFixed(row.boysFootLengthCm),
              F.formatFixed(row.girlMinusBoyCm)
            ];
          })
        );

        var chart = C.initChart(chartNode);
        chart.setOption({
          backgroundColor: C.darkGrid.backgroundColor,
          legend: { textStyle: { color: "#d7e7ff" } },
          tooltip: { trigger: "axis" },
          grid: { left: 56, right: 56, top: 48, bottom: 40 },
          xAxis: { type: "category", data: data.agesYears, name: "Age" },
          yAxis: [
            { type: "value", name: "Foot length (cm)", min: 12 },
            { type: "value", name: "Difference (cm)" }
          ],
          series: [
            { name: "Girls", type: "bar", data: data.girlsFootLengthCm, itemStyle: { color: "#12bac1" } },
            { name: "Boys", type: "bar", data: data.boysFootLengthCm, itemStyle: { color: "#319cf1" } },
            {
              name: "Girl − boy",
              type: "line",
              yAxisIndex: 1,
              smooth: true,
              data: data.girlMinusBoyCm,
              itemStyle: { color: "#3deaff" }
            }
          ]
        });
      }).catch(function (err) {
        C.showError(chartNode, err);
      });
    })();
  </script>
</body>
</html>
